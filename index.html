<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>.. Roleplay | Legal Ceza Sistemi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="legacy-app">
      <div class="legacy-toolbar">
        <div class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="text" placeholder="Suç adı, kategori veya açıklama ara." />
        </div>

        <div class="filter-box">
          <label>Kategori</label>
          <select id="categoryFilter">
            <option value="all">Tümü</option>
          </select>
        </div>

        <div class="filter-box">
          <label>Ağırılık</label>
          <select id="severityFilter">
            <option value="all">Tümü</option>
            <option value="light">Hafif</option>
            <option value="medium">Orta</option>
            <option value="heavy">Ağır</option>
          </select>
        </div>

        <div class="filter-box">
          <label>Sırala</label>
          <select id="sortBy">
            <option value="default">Varsayılan</option>
            <option value="title">İsim (A-Z)</option>
            <option value="duration">Süre</option>
            <option value="fine">Para Cezası</option>
            <option value="severity">Ağırılık</option>
          </select>
        </div>

        <button id="resetFilters" class="reset-button">Filtreleri Sıfırla</button>
      </div>

      <div class="summary-row">
        <div class="summary-card">
          <span>Toplam Kayıt</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="summary-card">
          <span>Toplam Ceza</span>
          <strong id="totalFine">₺0</strong>
        </div>
        <div class="summary-card">
          <span>En Yüksek Süre</span>
          <strong id="maxDuration">0 ay</strong>
        </div>
        <div class="summary-card">
          <span>Aktif Kategori</span>
          <strong id="activeCategory">Tümü</strong>
        </div>
      </div>

      <div id="noteBoard" class="note-board"></div>

      <div class="results-meta">
        <span id="resultsMeta">0 sonuç</span>
      </div>

      <div id="crimeBoard" class="crime-board"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
